name: Setup Environments

on:
  workflow_call:
    secrets:
      GH_PAT:
        description: "GitHub Personal Access Token for authentication"
        required: true

permissions:
  contents: write
  id-token: write
  actions: write
  deployments: write

jobs:
  setup-environments:
    name: Bootstrap Environments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Validate environment configuration file
        run: |
          set -euo pipefail

          echo "::group::Validating environment configuration"

          if [ ! -f ".env/environments.yaml" ]; then
            echo "❌ Configuration file not found: .env/environments.yaml"
            cat > /tmp/expected_format.md << 'EOF'
          ## Expected Format

          The configuration file must be located at `.env/environments.yaml` with the following structure:

          ```yaml
          ---
          environments:
            - ci: ci-account-alias
            - devl: devl-account-alias
            - test: test-account-alias
            - prod: prod-account-alias
          regions:
            - us-east-1
            - us-east-2
          ```

          Requirements:
          - `ci` environment is mandatory
          - `devl`, `test`, `prod` are optional
          - `regions` is mandatory (defaults to us-east-1 if omitted)
          EOF
            cat /tmp/expected_format.md >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          yq eval '.' .env/environments.yaml > /dev/null || {
            echo "❌ Invalid YAML syntax in .env/environments.yaml"
            exit 1
          }

          ci_env=$(yq eval '.environments[] | select(has("ci")) | .ci' .env/environments.yaml)
          if [ -z "$ci_env" ]; then
            echo "❌ ci environment is mandatory but not found"
            exit 1
          fi

          echo "✅ Configuration file is valid"
          echo "::endgroup::"

      - name: Parse environment configuration
        id: parse-config
        run: |
          set -euo pipefail

          echo "::group::Parsing environment configuration"

          # Read environments from YAML
          environments=$(yq eval '.environments[]' .env/environments.yaml | yq -s 'map(keys[0]) | join(",")')
          regions=$(yq eval '.regions[]' .env/environments.yaml | tr '\n' ',' | sed 's/,$//')

          if [ -z "$regions" ]; then
            regions="us-east-1"
          fi

          echo "environments=$environments" >> $GITHUB_OUTPUT
          echo "regions=$regions" >> $GITHUB_OUTPUT

          echo "Environments: $environments"
          echo "Regions: $regions"
          echo "::endgroup::"

      - name: Add CODEOWNERS as collaborators
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "::group::Parsing CODEOWNERS and adding collaborators"

          if [ ! -f "CODEOWNERS" ]; then
            echo "⚠️  CODEOWNERS file not found, skipping collaborator setup"
            echo "::endgroup::"
            exit 0
          fi

          owners=$(grep -v '^#' CODEOWNERS | awk '{$1=""; print $0}' | tr -s ' ' '\n' | grep '^@' | sort -u)

          for owner in $owners; do
            echo "Processing owner: $owner"

            if [[ "$owner" =~ ^@([a-zA-Z0-9._-]+)$ ]]; then
              username="${BASH_REMATCH[1]}"
              echo "Adding user: $username"
              gh api --method PUT "/repos/${GITHUB_REPOSITORY}/collaborators/$username" \
                -f permission='push' || echo "Failed to add $username — skipping."
            elif [[ "$owner" =~ ^@([a-zA-Z0-9._-]+)/([a-zA-Z0-9._-]+)$ ]]; then
              org="${BASH_REMATCH[1]}"
              team="${BASH_REMATCH[2]}"
              echo "Detected team: @${org}/${team}"
              gh api --method PUT "/orgs/${org}/teams/${team}/repos/${GITHUB_REPOSITORY}" \
                -f permission="push" || echo "Failed to add team — skipping."
            fi
          done

          echo "::endgroup::"

      - name: Delete all existing environments
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "::group::Fetching and deleting environments"
          environments=$(gh api "/repos/${GITHUB_REPOSITORY}/environments" --jq '.environments[].name' || true)

          if [ -z "$environments" ]; then
            echo "No environments to delete"
            echo "::endgroup::"
            exit 0
          fi

          for env in $environments; do
            echo "Deleting environment: $env"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/environments/$env"
          done

          echo "::endgroup::"

      - name: Create environments with secrets and variables
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          AWS_ACCOUNT_ID_MAP: ${{ vars.AWS_ACCOUNT_ID_MAP }}
          AWS_OIDC_ROLE: ${{ vars.AWS_OIDC_ROLE }}
          TF_STATE_BUCKET_BASE_NAME: ${{ vars.TF_STATE_BUCKET_BASE_NAME }}
          S3_KMS_KEY_ALIAS: ${{ vars.S3_KMS_KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "::group::Creating environments and setting secrets/variables"

          regions_array=(${{ steps.parse-config.outputs.regions }})

          # Process CI environment (non-regional)
          ci_account=$(yq eval '.environments[] | select(has("ci")) | .ci' .env/environments.yaml)
          ci_account_id=$(echo "$AWS_ACCOUNT_ID_MAP" | jq -r --arg name "$ci_account" '.[$name]')

          echo "Creating CI environment"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/environments/ci"

          gh secret set AWS_ROLE_ARN --env "ci" --body "arn:aws:iam::${ci_account_id}:role/${AWS_OIDC_ROLE}"
          gh secret set TF_STATE_BUCKET_NAME --env "ci" --body "${TF_STATE_BUCKET_BASE_NAME}-${ci_account_id}-ci-${regions_array[0]}"

          gh variable set AWS_REGION --env "ci" --body "${regions_array[0]}"
          gh variable set S3_KMS_KEY_ALIAS --env "ci" --body "alias/${S3_KMS_KEY_ALIAS}"
          gh variable set TF_STATE_BUCKET_NAME --env "ci" --body "${TF_STATE_BUCKET_BASE_NAME}-${ci_account_id}-ci-${regions_array[0]}"
          gh variable set AWS_ROLE_ARN --env "ci" --body "arn:aws:iam::${ci_account_id}:role/${AWS_OIDC_ROLE}"

          # Process other environments (regional)
          for env_type in devl test prod; do
            account=$(yq eval ".environments[] | select(has(\"$env_type\")) | .$env_type" .env/environments.yaml)
            if [ -z "$account" ] || [ "$account" == "null" ]; then
              continue
            fi

            account_id=$(echo "$AWS_ACCOUNT_ID_MAP" | jq -r --arg name "$account" '.[$name]')

            for region in "${regions_array[@]}"; do
              env_name="${env_type}-${account}-${region}"
              echo "Creating environment: $env_name"

              gh api --method PUT "repos/${GITHUB_REPOSITORY}/environments/$env_name"

              gh secret set AWS_ROLE_ARN --env "$env_name" --body "arn:aws:iam::${account_id}:role/${AWS_OIDC_ROLE}"
              gh secret set TF_STATE_BUCKET_NAME --env "$env_name" --body "${TF_STATE_BUCKET_BASE_NAME}-${account_id}-${env_type}-${region}"

              gh variable set AWS_REGION --env "$env_name" --body "$region"
              gh variable set S3_KMS_KEY_ALIAS --env "$env_name" --body "alias/${S3_KMS_KEY_ALIAS}"
              gh variable set TF_STATE_BUCKET_NAME --env "$env_name" --body "${TF_STATE_BUCKET_BASE_NAME}-${account_id}-${env_type}-${region}"
              gh variable set AWS_ROLE_ARN --env "$env_name" --body "arn:aws:iam::${account_id}:role/${AWS_OIDC_ROLE}"
            done
          done

          echo "::endgroup::"

  setup-branch-protection:
    name: Setup Branch Protection - Feature & Bug
    needs: setup-environments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Create branch protection rules for feature and bug branches
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "::group::Creating branch protection rules"

          ruleset_payload=$(cat <<'RULESET_EOF'
          {
            "name": "Branch Protection - Feature & Bug",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/feature/*", "refs/heads/bug/*"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "creation", "parameters": {} },
              { "type": "non_fast_forward", "parameters": {} },
              {
                "type": "pull_request",
                "parameters": {
                  "required_approving_review_count": 1,
                  "require_code_owner_reviews": true,
                  "dismiss_stale_reviews": true,
                  "require_last_push_approval": false
                }
              },
              {
                "type": "branch_name_pattern",
                "parameters": {
                  "operator": "regex",
                  "pattern": "^(feature|bug)\\/[a-zA-Z0-9\\-_.]+$"
                }
              }
            ]
          }
          RULESET_EOF
          )

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/rulesets" --input - <<< "$ruleset_payload" || \
          echo "⚠️  Failed to create ruleset (may already exist)"

          echo "✅ Branch protection rules applied"
          echo "::endgroup::"

  setup-main-branch-protection:
    name: Setup Branch Protection - Main
    needs: setup-branch-protection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Parse environment configuration for deployment requirements
        id: parse-config
        run: |
          set -euo pipefail

          environments=$(yq eval '.environments[]' .env/environments.yaml | yq -s 'map(keys[0]) | join(",")')
          echo "environments=$environments" >> $GITHUB_OUTPUT

      - name: Create branch protection rules for main branch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          echo "::group::Creating main branch protection rules"

          ruleset_payload=$(cat <<'RULESET_EOF'
          {
            "name": "Main Branch Protection",
            "target": "branch",
            "enforcement": "active",
            "conditions": {
              "ref_name": {
                "include": ["refs/heads/main"],
                "exclude": []
              }
            },
            "rules": [
              { "type": "deletion", "parameters": {} },
              { "type": "non_fast_forward", "parameters": {} },
              {
                "type": "pull_request",
                "parameters": { "required_approving_review_count": 1 }
              },
              {
                "type": "required_deployments",
                "parameters": { "required_deployment_environments": ["ci", "devl"] }
              }
            ]
          }
          RULESET_EOF
          )

          gh api --method POST "/repos/${GITHUB_REPOSITORY}/rulesets" --input - <<< "$ruleset_payload" || \
          echo "⚠️  Failed to create ruleset (may already exist)"

          echo "✅ Main branch protection rules applied"
          echo "::endgroup::"
